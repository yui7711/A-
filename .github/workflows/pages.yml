name: Deploy Obsidian Radar to GitHub Pages
on:
  push:
    branches: [main, master]
    paths: ['A-/**', '.github/workflows/pages.yml']
  workflow_dispatch:
  schedule:
    - cron: '10 1 * * 1-5'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: A-/package-lock.json
      - run: npm ci
        working-directory: A-
      - run: npm test
        working-directory: A-
      - run: npm run collect
        working-directory: A-
        env:
          FUYAO_API_KEY: ${{ secrets.FUYAO_API_KEY }}
      - run: node --experimental-strip-types scripts/collect-history.mjs
        working-directory: A-
        env:
          FUYAO_API_KEY: ${{ secrets.FUYAO_API_KEY }}
      - run: npm run build
        working-directory: A-
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: A-/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
